name: docker build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    build:
        ## CI runs only where we enabled it. Unset variable -> the job is
        ## skipped, no runner is allocated, and the run stays green: upstream
        ## and forks are never handed a red X for a lane they did not opt into.
        ## A fork that WANTS our CI sets the same variable in its own repo.
        if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image: debian:stable

        container:
            image: ${{ matrix.image }}

        steps:
            - name: Checkout main repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
              with:
                  persist-credentials: false
            # - name: Checkout developer-meta-files
            #   uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
            #   with:
            #       repository: Kicksecure/developer-meta-files
            #       path: developer-meta-files
            - name: System Basic Packages
              run: |
                  apt-get update
                  apt-get install --yes --no-install-recommends wine fpc adduser shellcheck lazarus git ca-certificates libfile-mimeinfo-perl
            - name: Install Packages from Debian trixie
              run: |
                  echo 'Types: deb' | tee /etc/apt/sources.list.d/trixie.sources
                  echo 'URIs: https://deb.debian.org/debian' | tee -a /etc/apt/sources.list.d/trixie.sources
                  echo 'Suites: trixie' | tee -a /etc/apt/sources.list.d/trixie.sources
                  echo 'Components: main' | tee -a /etc/apt/sources.list.d/trixie.sources
                  echo 'Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg' | tee -a /etc/apt/sources.list.d/trixie.sources
                  apt-get update
                  apt-get install --yes --no-install-recommends fp-units-win-base fp-units-win-rtl fp-units-win-fcl fp-units-win-misc
            - name: System information
              run: |
                  whoami
                  cat /etc/os-release
                  uname -a
                  echo "${PATH}"
            - name: Create regular (non-root) user
              run: adduser --comment "" --disabled-password user
            - name: Linux user file permissions fix
              run: chown --recursive user:user /__w/Whonix-Installer
            - name: Build and run test.exe
              run: su -s /bin/bash user -- ./test.sh
            # - name: ppcross_install
            #   run: ./developer-meta-files/usr/bin/ppcross_install all
            - name: Build Installer
              run: su -s /bin/bash user -- ./build-dummy.sh
            - name: ShellCheck
              uses: org-ai-assisted/developer-meta-files/.github/actions/shellcheck@master
              with:
                paths: '.'
